[project]
dynamic = ["version"]
name = "fastar-astro"
description = "Stellar population synthesis tools"
authors = [
  { name = "Ignacio Martin Navarro", email = "ignacio.martin@iac.es" }
]
urls = { "homepage" = "https://github.com/inavarro/fastar" }
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10.12"
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = [
    "astronomy",
    "astrophysics",
    "science",
]
dependencies = [
  "astropy>=6.1.7",
  "astroquery>=0.4.8",
  "flax>=0.10.5",
  "h5py>=3.12.1",
  "jax>=0.6.0",
  "matplotlib>=3.10.1",
  "numpy>=2.2.5",
  "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
  "build>=1.2.2.post1",
  "pre-commit~=3.5",
  "pytest>=8.3.4",
  "ruff>=0.14.4",
]
docs = [
  "asdf-astropy>=0.7.1",
  "astropy>=6.1.7",
  "nbsphinx>=0.9.7",
  "Sphinx>=4.3.2",
  "sphinx-book-theme>=1.1.4",
]

[project.scripts]
fastar-plot-filter-responses = "fastar.viz.filter_responses:main"
fastar-plot-imf-shapes = "fastar.viz.imf_shapes:main"

[build-system]
requires = ["setuptools>=65.5.1", "wheel>=0.41.1", "setuptools_scm>=8.3.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fastar"]

[tool.setuptools.package-data]
"fastar" = ["assets/**"]

[tool.setuptools_scm]
version_file = "fastar/_version.py"

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "single"
