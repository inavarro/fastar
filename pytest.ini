[pytest]
# Pytest configuration for FASTAR

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

# Markers for categorizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    imf: marks tests related to IMF functions
    synthesis: marks tests related to SSP synthesis

# Minimum Python version
minversion = 3.10

# Ignore certain directories
norecursedirs = .git .tox dist build *.egg venv docs

# Coverage options (if pytest-cov is installed)
# addopts = --cov=fastar --cov-report=html --cov-report=term
